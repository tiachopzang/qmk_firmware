name: QMK Compile
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - uses: actions/checkout@v4

      - name: Run Compile
        run: |
          # Di chuyển thư mục bàn phím của bạn vào đúng vị trí QMK cần
          mkdir -p /qmk_firmware/keyboards/handwired
          cp -R keyboards/handwired/antari /qmk_firmware/keyboards/handwired/
          
          # Chạy lệnh biên dịch từ thư mục gốc của QMK
          cd /qmk_firmware
          qmk compile -kb handwired/antari -km default
          
          # Copy file kết quả ngược lại thư mục làm việc để tải về
          cp /qmk_firmware/*.uf2 ${{ github.workspace }}/ || true
          cp /qmk_firmware/*.bin ${{ github.workspace }}/ || true
          cp /qmk_firmware/*.hex ${{ github.workspace }}/ || true

      - name: Export Firmware
        uses: actions/upload-artifact@v4
        with:
          name: antari_firmware
          path: |
            *.uf2
            *.bin
            *.hex
