name: QMK Manual Build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QMK
        run: |
          python3 -m pip install qmk
          git clone --depth 1 https://github.com/qmk/qmk_firmware.git
          cd qmk_firmware
          qmk setup -y
      - name: Compile
        run: |
          mkdir -p qmk_firmware/keyboards/handwired
          ln -s $(pwd)/keyboards/handwired/antari qmk_firmware/keyboards/handwired/antari
          cd qmk_firmware
          qmk compile -kb handwired/antari -km default
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: antari_firmware
          path: |
            qmk_firmware/*.uf2
            qmk_firmware/*.bin
            qmk_firmware/*.hex
