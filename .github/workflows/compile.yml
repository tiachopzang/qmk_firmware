name: QMK Compile
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - uses: actions/checkout@v4

      - name: Run Compile
        run: |
          # 1. Chuyển code của bạn vào đúng chỗ QMK cần
          mkdir -p /qmk_firmware/keyboards/handwired
          cp -R keyboards/handwired/antari /qmk_firmware/keyboards/handwired/
          
          # 2. Chạy lệnh biên dịch theo cú pháp của bản CLI mới
          cd /qmk_firmware
          python3 -m qmk.cli compile -kb handwired/antari -km default
          
          # 3. Gom file kết quả
          cp /qmk_firmware/*.uf2 ${{ github.workspace }}/ || true
          cp /qmk_firmware/*.bin ${{ github.workspace }}/ || true
          cp /qmk_firmware/*.hex ${{ github.workspace }}/ || true

      - name: Export Firmware
        uses: actions/upload-artifact@v4
        with:
          name: antari_firmware
          path: |
            *.uf2
            *.bin
            *.hex
