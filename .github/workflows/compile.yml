name: QMK Compile
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - uses: actions/checkout@v4

      - name: Run Compile
        run: |
          # Không dùng qmk setup để tránh lỗi tải lại
          # Chạy lệnh biên dịch trực tiếp từ thư mục repo
          qmk compile -kb handwired/antari -km default
        env:
          QMK_HOME: ${{ github.workspace }}

      - name: Export Firmware
        uses: actions/upload-artifact@v4
        with:
          name: antari_firmware
          path: ./*.uf2
