name: Build Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install QMK
        run: pip3 install qmk
      - name: Setup QMK
        run: qmk setup -y
      - name: Prepare and Compile
        run: |
          # Tạo cấu trúc thư mục đúng chuẩn QMK
          mkdir -p keyboards/handwired/antari
          # Chép toàn bộ file vào đúng chỗ QMK cần
          cp -r ./* keyboards/handwired/antari/ || true
          # Chạy lệnh biên dịch
          qmk compile -kb handwired/antari -km default
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: antari_firmware
          path: ./*.uf2
