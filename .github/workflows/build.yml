name: Build Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install QMK
        run: pip3 install qmk
      - name: Setup QMK
        run: qmk setup -y
      - name: Link and Compile
        run: |
          mkdir -p qmk_firmware/keyboards/handwired/
          ln -s $(pwd) qmk_firmware/keyboards/handwired/antari
          qmk compile -kb handwired/antari -km default
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: antari_firmware
          path: ./*.uf2
