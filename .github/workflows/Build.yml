name: Build Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install QMK
        run: pip3 install qmk

      - name: Compile Firmware
        run: |
          qmk setup -y
          # Lệnh quan trọng: Chỉ định vị trí thư mục hiện tại cho QMK
          qmk compile -kb handwired/antari -km default
        env:
          QMK_HOME: ${{ github.workspace }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: antari_firmware
          path: ./*.uf2
